################
# GLOBAL PATHS #
################
# Here we define the SOOPERCOOL output directory. The result is
# stored in the "out_dir" variable, which is used later on in the
# configuration file.
output_directory: &out_dir "{OUTPUT_DIR}"

#######################
# MAP SETS DEFINITION #
#######################
map_sets:
  "{MAP_SET_NAME}":
    map_dir: "{MAP_DIR}"
    beam_dir: "{PATH_TO_BEAM_FILES:UPDATE_THIS_PATH}"
    map_template: "{MAP_TEMPLATE}"
    beam_file : "{BEAM_FILE}"
    n_bundles: "{N_BUNDLES}"
    freq_tag: "{FREQ_TAG}"
    exp_tag: "{EXP_TAG}"
    filtering_tag: "{FILTERING_TAG}"
    kspace_tag: "{KSPACE_TAG}"
    hits_tag: "{HITS_TAG}"

#########
# MASKS #
#########
masks:
  box_mask: null
  use_weights: False
  analysis_mask: !path [*out_dir, masks/analysis_mask.fits]
  global_hits: null
  galactic_mask: "{GALACTIC_MASK:UPDATE_THIS_PATH}"
  point_source_catalog: null
  point_source_mask: null
  external_mask: null
  apod_radius: 10.0
  smoothing_radius: 10.0
  apod_radius_point_source: 1.0
  apod_type: "C1"

######################
# GENERAL PARAMETERS #
######################
general_pars:
  pix_type: car
  car_template: "{CAR_TEMPLATE}"
  nside: 512
  lmin: 2
  lmax: 650
  binning_file: "{BINNING_FILE:UPDATE_THIS_PATH}"
  pure_B: False
  # Where the beam window is lower than beam_floor, set it to beam_floor
  beam_floor: 1.e-2
  compute_Dl: True

##############
# COVARIANCE #
##############
covariance:
  cov_id_start: 0
  cov_num_sims: "{COV_NUM_SIMS}"
  fiducial_cmb: null
  fiducial_dust: null
  fiducial_synch: null
  # Optional, path to noise realisation maps.
  # The template should include format fields
  # {id_sim}, {map_set}, {id_bundle}
  noise_map_sims_dir:
    null: null
  noise_map_sims_template:
    null: null
  # This is only relevant to build
  # anisotropic noise covariance
  # couplings for analytic covariances.
  hits_files:
    null: null

#####################
# TRANSFER FUNCTION #
#####################
transfer_settings:
  transfer_directory: !path [*out_dir, transfer_functions]
  tf_est_num_sims: "{TF_EST_NUM_SIMS}"
  sim_id_start: "{TF_SIMS_ID_START}"
  # Parameters of the PL sims to generate
  # input simulations for TF estimation.
  # This power spectrum is NOT used in the
  # TF estimation process.
  power_law_pars_tf_est:
    amp: 1.0
    delta_ell: 10
    power_law_index: 2.
  # This should contain the path to
  # a npz file with keys l, cl.
  power_law_c_ell: "{POWER_LAW_C_ELL:UPDATE_THIS_PATH}"
  # Can be "MT" or "TM"
  tf_ordering: "TM"

  unfiltered_map_dir:
    null: null
  unfiltered_map_template:
    null: null
  filtered_map_dir:
    null: null
  filtered_map_template:
    null: null

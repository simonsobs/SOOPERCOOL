output_directory: &out_dir "{OUTPUT_DIR}"

map_sets:
  "{MAP_SET_NAME}":
    map_dir: "{MAP_DIR}"
    beam_dir: "{PATH_TO_BEAM_FILES}"
    map_template: "{MAP_TEMPLATE}"
    beam_file : "{BEAM_FILE}"
    n_bundles: "{N_BUNDLES}"
    freq_tag: "{FREQ_TAG}"
    exp_tag: "{EXP_TAG}"
    filtering_tag: "{FILTERING_TAG}"
    kspace_tag: "{KSPACE_TAG}"
    hits_tag: "{HITS_TAG}"

#########
# MASKS #
#########
masks:
  box_mask: null
  use_weights: False
  analysis_mask: !path [*out_dir, masks/analysis_mask.fits]
  global_hits: null
  galactic_mask: /cephfs/soukdata/user_data/alaposta/metadata/mask_GAL070_coords_c_sat_f090_geometry.fits
  point_source_catalog: null
  point_source_mask: null
  external_mask: null
  apod_radius: 10.0
  smoothing_radius: 10.0
  apod_radius_point_source: 1.0
  apod_type: "C1"

####################################
# Metadata related to the analysis #
####################################
## General parameters
general_pars:
  pix_type: car
  car_template: "{CAR_TEMPLATE}"
  nside: 512
  lmin: 2
  lmax: 650
  binning_file: /cephfs/soukdata/user_data/alaposta/metadata/binning_car_lmax2700_deltal15.npz
  pure_B: False
  # Where the beam window is lower than beam_floor, set it to beam_floor
  beam_floor: 1.e-2
  compute_Dl: True

covariance:
  cov_num_sims: 200
  fiducial_cmb: null
  fiducial_dust: null
  fiducial_synch: null

  ## (Optional) directories of simulated noise maps
  noise_map_sims_dir:
    SATp1_f090_south_science: /path/to/your/noise/sims
    SATp1_f150_south_science: /path/to/your/noise/sims
  ## (Optional) file name templates for noise sims.
  # The parameters id_sim, map_set, and id_bundle will be recognized when
  # written inside braces, and interpreted during python string formatting.
  noise_map_sims_template:
    SATp1_f090_south_science: satp1_f090_science_bundle{id_bundle}_{id_sim:04d}_map.fits
    SATp1_f150_south_science: satp1_f150_science_bundle{id_bundle}_{id_sim:04d}_map.fits

  hits_files:
  # This is only useful for analytic covariances
    SATp1_f090_south_science: /path/to/coadd/hits.fits
    SATp1_f150_south_science: /path/to/coadd/hits.fits

transfer_settings:
  transfer_directory: !path [*out_dir, transfer_functions]
  # For estimation
  ## Number of sims for tf estimation
  tf_est_num_sims: 5
  sim_id_start: 0
  ## Parameters of the PL sims used for TF estimation
  power_law_pars_tf_est:
    amp: 1.0
    delta_ell: 10
    power_law_index: 2.
  ## Optional beams applied on PL sims
  # If true, beams will be applied only on the validation simulations. By default (false)
  # beam are applied to both the estimation and validation sims,
  # to account for potential effect of the beam on the TF (e.g. commutativity)
  do_not_beam_est_sims: True
  beams_list: []

  ## Path to the sims for TF estimation
  unfiltered_map_dir:
    SATp1_f090_south_science: /cephfs/soukdata/user_data/alaposta/input_tf_sims
    SATp1_f150_south_science: /cephfs/soukdata/user_data/alaposta/input_tf_sims
  unfiltered_map_template:
    SATp1_f090_south_science: "{pure_type}_4.0arcmin_fwhm30_sim{id_sim:04d}_CAR.fits"
    SATp1_f150_south_science: "{pure_type}_4.0arcmin_fwhm30_sim{id_sim:04d}_CAR.fits"
  filtered_map_dir:
    SATp1_f090_south_science: /path/to/coadded/sims/dir
    SATp1_f150_south_science: /path/to/coadded/sims/dir
  filtered_map_template:
    SATp1_f090_south_science: "{pure_type}_1.0arcmin_fwhm30_sim{id_sim:04d}_CAR_bundle0_f090_science_filtered.fits"
    SATp1_f150_south_science: "{pure_type}_1.0arcmin_fwhm30_sim{id_sim:04d}_CAR_bundle0_f150_science_filtered.fits"
